# Retired routes
[[redirects]]
  from = "/donate"
  to = "/give.html"
  status = 301

[[redirects]]
  from = "/donate.html"
  to = "/give.html"
  status = 301

[[redirects]]
  from = "/volunteer"
  to = "/serve.html"
  status = 301

[[redirects]]
  from = "/volunteer.html"
  to = "/serve.html"
  status = 301

[[redirects]]
  from = "/partners"
  to = "/give.html"
  status = 301
  force = true

[[redirects]]
  from = "/partners.html"
  to = "/give.html"
  status = 301
  force = true

[[redirects]]
  from = "/resources"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/faith"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/faith.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/faith-communities"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/respond"
  to = "/respond.html"
  status = 200

[[redirects]]
  from = "/rising"
  to = "/rising.html"
  status = 200

[[redirects]]
  from = "/hold-the-line"
  to = "/hold-the-line.html"
  status = 200

# ─── SECURITY HEADERS (§9.12: no tracking, no third-party calls) ───
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
