[build]
  publish = "."

[[redirects]]
  from = "/programs"
  to = "/programs.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/help.html"
  status = 200

[[redirects]]
  from = "/give"
  to = "/give.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/serve"
  to = "/serve.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Retired routes
[[redirects]]
  from = "/donate"
  to = "/give.html"
  status = 301

[[redirects]]
  from = "/donate.html"
  to = "/give.html"
  status = 301

[[redirects]]
  from = "/volunteer"
  to = "/serve.html"
  status = 301

[[redirects]]
  from = "/volunteer.html"
  to = "/serve.html"
  status = 301

[[redirects]]
  from = "/partners"
  to = "/give.html"
  status = 301
  force = true

[[redirects]]
  from = "/partners.html"
  to = "/give.html"
  status = 301
  force = true

[[redirects]]
  from = "/resources"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/resources.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/faith"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/faith.html"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/faith-communities"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
